version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: risking-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-risking}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-risking_password}
      POSTGRES_DB: ${POSTGRES_DB:-risking_db}
    volumes:
      - risking_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-risking} -d ${POSTGRES_DB:-risking_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: risking-backend
    restart: always
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-risking}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-risking_password}
      - DB_NAME=${POSTGRES_DB:-risking_db}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://risking.online}
    container_name: risking-frontend
    restart: always
    environment:
      - NEXT_PUBLIC_BACKEND_URL=${NEXT_PUBLIC_BACKEND_URL:-https://risking.online}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: risking-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - frontend
      - backend

volumes:
  risking_pgdata:
